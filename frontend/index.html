<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mario Kart 8 Deluxe - Archipelago Manual</title>
    <style>
        :root {
            --bg: #1a1a2e;
            --panel: #16213e;
            --accent: #e94560;
            --accent2: #0f3460;
            --text: #eee;
            --muted: #aaa;
            --available: #2ecc71;
            --locked: #555;
            --done: #3498db;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0; font-family: 'Segoe UI', system-ui, sans-serif;
            background: var(--bg); color: var(--text);
        }
        header {
            background: var(--accent2); padding: 1rem 1.5rem;
            border-bottom: 4px solid var(--accent);
        }
        header h1 { margin: 0; font-size: 1.4rem; }
        header p { margin: .3rem 0 0; color: var(--muted); font-size: .9rem; }
        .container { padding: 1rem; max-width: 1200px; margin: 0 auto; }
        .grid { display: grid; grid-template-columns: 320px 1fr; gap: 1rem; }
        @media (max-width: 900px) { .grid { grid-template-columns: 1fr; } }

        .panel {
            background: var(--panel); border-radius: 10px;
            padding: 1rem; margin-bottom: 1rem;
            box-shadow: 0 4px 10px rgba(0,0,0,.3);
        }
        label { display: block; margin-top: .7rem; font-size: .85rem; color: var(--muted); }
        input {
            width: 100%; padding: .55rem; margin-top: .2rem;
            border: 1px solid var(--accent2); border-radius: 6px;
            background: var(--bg); color: var(--text);
        }
        button {
            border: none; border-radius: 6px; padding: .6rem 1rem;
            background: var(--accent); color: white; cursor: pointer;
            font-weight: 600; margin-top: .8rem;
        }
        button:hover { filter: brightness(1.1); }
        button:disabled { background: var(--locked); cursor: not-allowed; }

        .status { font-size: .85rem; margin-top: .5rem; }
        .status.connected { color: var(--available); }
        .status.disconnected { color: var(--accent); }

        .stats { display: flex; gap: 1rem; flex-wrap: wrap; margin-bottom: 1rem; }
        .stat {
            background: var(--panel); border-radius: 8px; padding: .7rem 1rem;
            min-width: 120px; text-align: center;
        }
        .stat b { display: block; font-size: 1.4rem; color: var(--accent); }
        .stat span { font-size: .75rem; color: var(--muted); }

        /* Track grid */
        #tracks {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: .7rem;
        }

        /* Tile: the whole image is the button */
        .tile {
            position: relative; display: block;
            padding: 0; margin: 0;              /* reset of base button (padding .6rem 1rem, margin-top .8rem) */
            border: 3px solid transparent; border-radius: 10px;
            overflow: hidden; cursor: pointer;
            background: var(--bg);
            transition: filter .15s ease;
        }
        .tile img {
            display: block; width: 100%;
            aspect-ratio: 16 / 9; object-fit: cover;
        }
        /* Name caption inside the image */
        .tile .name {
            position: absolute; left: 0; right: 0; bottom: 0;
            padding: 1rem .35rem .3rem;
            font-size: .72rem; font-weight: 600; line-height: 1.1;
            text-align: center; color: #fff;
            background: linear-gradient(transparent, rgba(0,0,0,.85));
            pointer-events: none;
        }
        /* ✓/✕ symbol in the corner */
        .tile .badge {
            position: absolute; top: 5px; right: 5px;
            width: 26px; height: 26px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: .95rem; font-weight: 700; color: #fff;
            pointer-events: none;
        }

        /* States */
        .tile.available { border-color: var(--available); }
        .tile.done      { border-color: var(--done); }
        .tile.done .badge { background: var(--done); }
        .tile.locked    { border-color: var(--locked); cursor: not-allowed; }
        .tile.locked img  { filter: brightness(.45); }        /* dimmer brightness */
        .tile.locked .badge { background: rgba(0,0,0,.75); }

        /* Hover only on clickable tiles; done stays slightly dimmed */
        .tile:not(:disabled):hover img { filter: brightness(1.15); }
        .tile.done img { filter: brightness(.85); }
        .tile.done:not(:disabled):hover img { filter: brightness(1); }

        /* the base button's disabled state must not paint the background gray */
        .tile:disabled { background: var(--bg); }

        /* GOAL card: keeps the row layout, spanning the full grid width */
        .goal-card {
            grid-column: 1 / -1;
            display: flex; align-items: center; justify-content: space-between;
            min-height: 60px; padding: .6rem .8rem;
            border-radius: 6px;
            border-left: 4px solid var(--locked);
            background: linear-gradient(90deg, var(--bg) 0%, rgba(233,69,96,0.15) 100%);
        }
        .goal-card.available { border-color: var(--available); }
        .goal-card.done { border-color: var(--done); opacity: .75; }
        .goal-card b { font-weight: 600; }
        .goal-card small { color: var(--muted); font-size: .75rem; }
        .goal-card button { margin: 0; padding: .35rem .7rem; font-size: .8rem; }

        .inventory {
            display: flex; flex-wrap: wrap; gap: .4rem; margin-top: .5rem;
            max-height: 200px; overflow-y: auto;
        }
        .item {
            background: var(--accent2); padding: .3rem .6rem; border-radius: 4px;
            font-size: .8rem;
        }

        .log {
            font-family: monospace; font-size: .8rem;
            background: #0d1117; padding: .7rem; border-radius: 6px;
            max-height: 200px; overflow-y: auto; white-space: pre-wrap;
            color: #c9d1d9;
        }
        .log .info { color: #58a6ff; }
        .log .success { color: #2ecc71; }
        .log .error { color: #f85149; }

        .filter { margin-bottom: .8rem; }
        .filter button {
            margin-right: .4rem; margin-top: 0; background: var(--accent2);
        }
        .filter button.active { background: var(--accent); }
    </style>
</head>

            const line = document.createElement('div');
            line.className = cls;
            line.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
            elLog.appendChild(line);
            elLog.scrollTop = elLog.scrollHeight;
        }

        function send(cmd, payload) {
            if (!ws || ws.readyState !== WebSocket.OPEN) return;
            ws.send(JSON.stringify([{ cmd, ...payload }]));
        }

        function connect() {
            const host = elHost.value.trim();
            const port = elPort.value.trim();
            const slot = elSlot.value.trim();
            if (!slot) { log('Please enter the slot name.', 'error'); return; }

            const url = `ws://${host}:${port}`;
            log(`Connecting to ${url}...`);
            ws = new WebSocket(url);

            ws.onopen = () => log('WebSocket open. Waiting for RoomInfo...');
            ws.onmessage = (ev) => { for (const p of JSON.parse(ev.data)) handlePacket(p); };
            ws.onclose = () => {
                connected = false;
                updateStatus('Disconnected', false);
                elBtnConnect.disabled = false;
                elBtnDisconnect.disabled = true;
                log('Connection closed.', 'error');
            };
            ws.onerror = () => log('Connection error.', 'error');

            window._pendingSlot = slot;
            window._pendingPassword = elPassword.value;
        }

        function disconnect() { if (ws) ws.close(); }

        function updateStatus(text, isConnected) {
            elStatus.textContent = text;
            elStatus.className = 'status ' + (isConnected ? 'connected' : 'disconnected');
        }

        function handlePacket(p) {
            switch (p.cmd) {
                case 'RoomInfo':
                    log(`Server: seed "${p.seed_name}"`);
                    send('GetDataPackage', { games: ['Manual_Mario Kart 8 Deluxe_ManualMK8D'] });
                    send('Connect', {
                        password: window._pendingPassword || '',
                        game: 'Manual_Mario Kart 8 Deluxe_ManualMK8D',
                        name: window._pendingSlot,
                        uuid: localStorage.getItem('ap_uuid') || crypto.randomUUID(),
                        version: { major: 0, minor: 6, build: 0, class: 'Version' },
                        items_handling: 0b111,
                        tags: [],
                        slot_data: true
                    });
                    break;

                case 'DataPackage':
                    const dp = p.data?.games?.['Manual_Mario Kart 8 Deluxe_ManualMK8D'];
                    if (dp) {
                        itemIdToName = Object.fromEntries(Object.entries(dp.item_name_to_id || {}).map(([k,v]) => [v,k]));
                        locationNameToId = dp.location_name_to_id || {};
                        log('DataPackage received.');
                    }
                    break;

                case 'Connected':
                    connected = true;
                    mySlot = p.slot;
                    checkedLocations = new Set(p.checked_locations || []);
                    trackRequirements = p.slot_data?.track_requirements || {};
                    log(`Connected as slot ${p.slot}.`);
                    updateStatus(`Connected: ${p.slot}`, true);
                    elBtnConnect.disabled = true;
                    elBtnDisconnect.disabled = false;
                    render();
                    break;

                case 'ConnectionRefused':
                    log(`Connection refused: ${p.errors?.join(', ')}`, 'error');
                    break;

                case 'ReceivedItems':
                    for (const it of p.items || []) {
                        const name = itemIdToName[it.item] || `Item #${it.item}`;
                        ownedItems.add(name);
                        log(`Received: ${name}`, 'success');
                        if (name === '__Victory__') {
                            log('🏆 VICTORY! Goal complete.', 'success');
                            send('StatusUpdate', { status: 30 });
                        }
                    }
                    render();
                    break;

                case 'RoomUpdate':
                    if (p.checked_locations) {
                        for (const id of p.checked_locations) checkedLocations.add(id);
                        render();
                    }
                    break;

                case 'InvalidPacket':
                    log(`Invalid packet: ${p.text}`, 'error');
                    break;
            }
        }

        function completedTracksCount() {
            let count = 0;
            for (let i = 1; i <= TOTAL_TRACKS; i++) if (isDone(i)) count++;
            return count;
        }

        function isDone(index) { const id = trackLocId(index); return id != null && checkedLocations.has(id); }

        function ownedUnlockCount() {
            let count = 0;
            for (const name of ownedItems) {
                if (name.startsWith('Track Unlock ')) count++;
            }
            return count;
        }

        function requiredUnlockFor(index) {
            const name = TRACKS[index - 1];
            return trackRequirements[name] ?? 0;
        }

        function isAvailable(index) {
            if (isDone(index)) return false;
            const req = requiredUnlockFor(index);
            if (req <= 0) return true;
            return ownedUnlockCount() >= req;
        }

        function isGoalAvailable() { return completedTracksCount() >= GOAL_THRESHOLD && !isGoalDone(); }

        function render() {
            const done = completedTracksCount();
            const available = Array.from({length: TOTAL_TRACKS}, (_, i) => i + 1).filter(i => isAvailable(i)).length;
            const locked = TOTAL_TRACKS - done - available;
            const progress = Math.floor((done / TOTAL_TRACKS) * 100);

            document.getElementById('statDone').textContent = done;
            document.getElementById('statAvailable').textContent = available;
            document.getElementById('statLocked').textContent = locked;
            document.getElementById('statProgress').textContent = progress + '%';

            elInventory.innerHTML = '';
            if (ownedItems.size === 0) {
                elInventory.innerHTML = '<span class="item">No items yet</span>';
            } else {
                const sorted = Array.from(ownedItems).sort();
                for (const name of sorted) {
                    const span = document.createElement('span');
                    span.className = 'item';
                    span.textContent = name;
                    elInventory.appendChild(span);
                }
            }

            elTracks.innerHTML = '';
            for (let i = 1; i <= TOTAL_TRACKS; i++) {
                const done = isDone(i);
                const available = isAvailable(i);
                if (currentFilter === 'done' && !done) continue;
                if (currentFilter === 'available' && !available) continue;
                if (currentFilter === 'locked' && (done || available)) continue;

                const req = requiredUnlockFor(i);
                const statusText = done ? 'Completed' : available ? 'Available' : `Requires ${req} unlock${req === 1 ? '' : 's'}`;

                // The whole image is the button
                const btn = document.createElement('button');
                btn.className = 'tile ' + (done ? 'done' : available ? 'available' : 'locked');
                btn.disabled = !available;                    // locked (and completed) not clickable
                btn.title = `#${i} ${TRACKS[i-1]} — ${statusText}`;
                btn.setAttribute('aria-label', `#${i} ${TRACKS[i-1]} (${statusText})`);
                btn.onclick = () => checkLocation(i);

                const img = document.createElement('img');
                img.src = TRACK_IMAGES[i-1];
                img.alt = TRACKS[i-1];
                img.loading = 'lazy';                          // 96 images: only loads what's visible
                btn.appendChild(img);

                const name = document.createElement('span');
                name.className = 'name';
                name.textContent = TRACKS[i-1];
                btn.appendChild(name);

                if (done || !available) {                      // ✓ for completed, ✕ for locked
                    const badge = document.createElement('span');
                    badge.className = 'badge';
                    badge.textContent = done ? '✓' : '✕';
                    btn.appendChild(badge);
                }

                elTracks.appendChild(btn);
            }

            const goalDone = isGoalDone();
            const goalAvailable = isGoalAvailable();
            if (currentFilter === 'all' || (currentFilter === 'available' && goalAvailable) || (currentFilter === 'done' && goalDone)) {
                const div = document.createElement('div');
                div.className = 'goal-card';
                if (goalDone) div.classList.add('done');
                else if (goalAvailable) div.classList.add('available');

                const info = document.createElement('div');
                info.innerHTML = `<b>🏆 GOAL</b><br><small>${goalDone ? 'Completed!' : `Requires ${GOAL_THRESHOLD}/${TOTAL_TRACKS} tracks (${done} completed)`}</small>`;

                const btn = document.createElement('button');
                btn.textContent = goalDone ? '✓' : 'Complete Goal';
                btn.disabled = !goalAvailable;
                btn.onclick = () => completeGoal();

                div.appendChild(info);
                div.appendChild(btn);
                elTracks.appendChild(div);
            }
        }

        function checkLocation(index) {
            if (!connected) { log('You are not connected.', 'error'); return; }
            const id = trackLocId(index);
            if (id == null) { log(`Location ID not found for "${TRACKS[index-1]}" (missing DataPackage?).`, 'error'); return; }
            send('LocationChecks', { locations: [id] });
            checkedLocations.add(id);
            log(`Track #${index} ${TRACKS[index-1]} completed.`);
            render();
        }

        function completeGoal() {
            if (!connected) { log('You are not connected.', 'error'); return; }
            if (completedTracksCount() < GOAL_THRESHOLD) {
                log(`You need ${GOAL_THRESHOLD} tracks for the goal.`, 'error');
                return;
            }
            // Check all remaining tracks + the victory location (real IDs).
            const ids = [];
            for (let i = 1; i <= TOTAL_TRACKS; i++) {
                if (!isDone(i)) { const id = trackLocId(i); if (id != null) ids.push(id); }
            }
            const gid = goalLocId();
            if (gid != null && !checkedLocations.has(gid)) ids.push(gid);
            if (ids.length) {
                send('LocationChecks', { locations: ids });
                for (const id of ids) checkedLocations.add(id);
            }
            // Mark the slot as goal-complete on the server (ClientStatus.CLIENT_GOAL = 30).
            // Without this the server doesn't consider the game finished and won't auto-release.
            send('StatusUpdate', { status: 30 });
            log(`🏆 GOAL! ${ids.length ? ids.length - (gid != null ? 1 : 0) : 0} remaining tracks and the goal were completed. All items will be released.`, 'success');
            render();
        }

        document.querySelectorAll('.filter button').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.filter button').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentFilter = btn.dataset.filter;
                render();
            });
        });

        elBtnConnect.onclick = connect;
        elBtnDisconnect.onclick = disconnect;

        render();
    </script>
</body>
</html>
